{% extends "travel/base.html" %}{% block title %}Calendar{% endblock %}
{% block content %}<div class="container-fluid px-lg-5 py-5"><div class="page-head"><div><span class="eyebrow dark">YOUR TIMELINE</span><h1>Calendar</h1><p>A single view of the journeys ahead.</p></div></div><div class="calendar-grid" id="calendarGrid"></div></div>{% endblock %}
{% block scripts %}<script>const events={{ events|safe }};const grid=document.getElementById('calendarGrid');let d=new Date();let y=d.getFullYear(),m=d.getMonth();function render(){let first=new Date(y,m,1),last=new Date(y,m+1,0);let html='<div class="cal-head"><button class="icon-btn" onclick="m--;if(m<0){m=11;y--}render()">‹</button><h3>'+first.toLocaleString('en',{month:'long'})+' '+y+'</h3><button class="icon-btn" onclick="m++;if(m>11){m=0;y++}render()">›</button></div><div class="cal-week">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<b>'+x+'</b>').join('')+'</div><div class="cal-days">';for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let day=1;day<=last.getDate();day++){let ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');let ev=events.filter(e=>e.date===ds);html+='<div class="cal-cell"><strong>'+day+'</strong>'+ev.map(e=>'<a href="'+e.url+'">'+e.title+'</a>').join('')+'</div>'}grid.innerHTML=html+'</div>'}render();</script>{% endblock %}
