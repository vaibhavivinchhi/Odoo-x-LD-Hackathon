{% extends "travel/base.html" %}{% block title %}Share trip{% endblock %}
{% block content %}<div class="container py-5" style="max-width:800px"><div class="share-card"><span class="eyebrow">READY TO SHARE</span><h1>{{ trip.title }}</h1><p class="text-muted">Anyone with this link can view your read-only itinerary.</p><div class="share-input"><input id="shareUrl" class="form-control" value="{{ share_url }}" readonly><button class="btn btn-dark" onclick="copyShare()">Copy</button></div><div class="d-flex gap-2 mt-3"><a target="_blank" href="https://wa.me/?text={{ share_url|urlencode }}" class="btn btn-success"><i class="bi bi-whatsapp"></i> WhatsApp</a><a target="_blank" href="mailto:?subject={{ trip.title|urlencode }}&body={{ share_url|urlencode }}" class="btn btn-outline-dark"><i class="bi bi-envelope"></i> Email</a></div><a class="d-inline-block mt-4" href="{{ trip.get_absolute_url }}">← Back to trip</a></div></div>{% endblock %}
{% block scripts %}<script>function copyShare(){navigator.clipboard.writeText(document.getElementById('shareUrl').value);alert('Link copied!')}</script>{% endblock %}
