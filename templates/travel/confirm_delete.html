{% extends "travel/base.html" %}{% block title %}Delete trip{% endblock %}
{% block content %}<div class="container py-5"><div class="form-card text-center mx-auto" style="max-width:560px"><i class="bi bi-trash3 display-5 text-danger"></i><h2 class="mt-3">Delete “{{ trip.title }}”?</h2><p class="text-muted">This permanently removes the trip, itinerary and expenses.</p><form method="post">{% csrf_token %}<a href="{{ trip.get_absolute_url }}" class="btn btn-light me-2">Cancel</a><button class="btn btn-danger">Delete trip</button></form></div></div>{% endblock %}
