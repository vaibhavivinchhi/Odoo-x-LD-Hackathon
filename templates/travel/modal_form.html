{% extends "travel/base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="container py-5" style="max-width:700px"><div class="form-card"><a href="{{ back_url }}" class="back-link-dark"><i class="bi bi-arrow-left"></i> Back</a><h2 class="mt-3">{{ title }}</h2><form method="post" class="mt-4">{% csrf_token %}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save</button></form></div></div>{% endblock %}
